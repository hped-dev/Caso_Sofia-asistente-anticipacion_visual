spring.application.name=asistente-anticipacion-visual

# H2 embebida para prototipo (sin servidor de base de datos externo)
spring.datasource.url=jdbc:h2:mem:asistente-db
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false

# JPA: crea esquema automáticamente en cada arranque (prototipo)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Servidor web
server.port=${PORT:8080}
server.servlet.context-path=/
